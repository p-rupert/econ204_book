name: Deploy MyST HTML to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          activate-environment: myst
          environment-name: myst

      - name: Install MyST
        shell: bash -l {0}
        run: conda install -y -c conda-forge mystmd

      - name: Build static HTML
        shell: bash -l {0}
        env:
          BASE_URL: /
        run: |
          myst build --html

      - name: Add CNAME
        run: echo "econ204.peterrupert.com" > _build/html/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

