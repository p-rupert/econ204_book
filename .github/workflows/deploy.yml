name: Deploy MyST HTML to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: ''
  MYST_SITE_URL: 'https://econ204.peterrupert.com'
  SITE_URL: 'https://econ204.peterrupert.com'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install MyST
        run: npm install -g mystmd

      - name: Build static HTML
        run: myst build --html

      - name: Add CNAME
        run: echo "econ204.peterrupert.com" > _build/html/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4



