name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  push:
    branches: [main]

env:
  BASE_URL: ''
  MYST_SITE_URL: 'https://econ204.peterrupert.com'
  SITE_URL: 'https://econ204.peterrupert.com'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install MyST + Jupyter Book
        run: npm install -g mystmd jupyter-book

      - name: Build HTML
        run: myst build --html

      - name: Add CNAME
        run: echo "econ204.peterrupert.com" > ./_build/html/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



