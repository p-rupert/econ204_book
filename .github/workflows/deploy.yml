name: Deploy MyST HTML to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install MyST
        run: npm install -g mystmd

      - name: Build static HTML
        env:
          BASE_URL: ''
          MYST_SITE_URL: 'https://econ204.peterrupert.com'
          SITE_URL: 'https://econ204.peterrupert.com'
        run: myst build --html

      - name: Fix robots.txt and sitemap URLs
        run: |
          if [ -f _build/html/robots.txt ]; then
            sed -i 's#http://localhost:[0-9]*/#https://econ204.peterrupert.com/#g' _build/html/robots.txt || true
          fi
          if [ -f _build/html/sitemap.xml ]; then
            sed -i 's#http://localhost:[0-9]*/#https://econ204.peterrupert.com/#g' _build/html/sitemap.xml || true
          fi

      - name: Add CNAME
        run: echo "econ204.peterrupert.com" > _build/html/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
